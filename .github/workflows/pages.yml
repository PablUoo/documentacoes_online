# Publica o site juntando o código (branch main) com os documentos (branch dados).
# Roda a cada push na main e é disparado pela branch dados quando o painel salva algo.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Baixar documentos
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dados
          path: dados

      - name: Montar site
        run: |
          mkdir -p site/data
          if [ -d dados/data ]; then cp -r dados/data/. site/data/; fi
          if [ -d dados/arquivos ]; then cp -r dados/arquivos site/; fi
          [ -f site/data/documentos.json ] || echo "[]" > site/data/documentos.json
          rm -rf site/.git site/.github

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
